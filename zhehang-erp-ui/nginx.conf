worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    # 访问日志只记录路径，不记录查询参数，避免异常请求把敏感字段写入日志。
    log_format safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log safe;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # 后端服务(docker-compose 服务名 erp-server)
    upstream erp_backend {
        server erp-server:8080;
    }

    # 浏览器安全头。脚本禁止 inline/eval；Element Plus 的动态 style 属性单独放行。
    map $sent_http_content_type $security_csp {
        default "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://zhehangjituan.xn--fiqs8s; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:";
    }

    # =====================================================================
    # HTTP(80)· 域名访问:放行证书验证,其余一律跳转 HTTPS
    # =====================================================================
    server {
        listen 80;
        server_name zhehangjituan.xn--fiqs8s www.zhehangjituan.xn--fiqs8s;

        # Let's Encrypt 验证/续期(优先级最高,不被下面的跳转吃掉)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://zhehangjituan.xn--fiqs8s$request_uri;
        }
    }

    # =====================================================================
    # HTTP(80)· 默认(IP 直接访问 47.243.27.11 仍用 http,不强跳 https)
    # =====================================================================
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # HTTPS 直接访问 IP 或未知 Host 时也不能落入正式站点。复用正式证书仅用于完成
    # TLS 握手，握手后立即丢弃请求；浏览器不会得到任何系统页面或接口内容。
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/zhehangjituan.xn--fiqs8s/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zhehangjituan.xn--fiqs8s/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        return 444;
    }

    # =====================================================================
    # HTTPS(443)· 域名访问主入口
    # =====================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name zhehangjituan.xn--fiqs8s www.zhehangjituan.xn--fiqs8s;

        ssl_certificate     /etc/letsencrypt/live/zhehangjituan.xn--fiqs8s/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zhehangjituan.xn--fiqs8s/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # www 统一跳到主域名
        if ($host = www.zhehangjituan.xn--fiqs8s) {
            return 301 https://zhehangjituan.xn--fiqs8s$request_uri;
        }

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $security_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # 生产环境不存在本地预览与 API 文档入口，即使后端配置误开也不对外暴露。
        location ^~ /local-preview/ { return 404; }
        location = /api/doc.html { return 404; }
        location ^~ /api/v3/api-docs { return 404; }
        location ^~ /api/swagger-resources { return 404; }
        location ^~ /api/webjars/ { return 404; }

        # SPA 入口不能长期缓存：发布后再次打开或刷新页面时必须拿到当前登录协议。
        # 哈希静态资源仍由下方规则长期缓存；这里只覆盖 index.html。
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            # 子 location 定义 add_header 后不会继承父级，六项安全头必须显式保留。
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Content-Security-Policy $security_csp always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        # 前端静态文件(SPA:找不到的路径回退到 index.html)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Content-Security-Policy $security_csp always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
        }

        # /api 反向代理到后端
        location /api/ {
            proxy_pass http://erp_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://erp_backend/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
